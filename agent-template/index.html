<!DOCTYPE html>
<!--
  index.html — ブラウザ用ダッシュボードのスキャフォールド。

  表示データ（assets/js/data.js）は `python src/main.py` 実行時に
  src/modules/dashboard_sync.py が input/ から自動生成する。
  JS の読み込み順は data → logic → ui → main（依存順）。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{エージェント名} ダッシュボード</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>{エージェント名} ダッシュボード</h1>
    <p class="subtitle">{このダッシュボードで何を試せるかを1文で書く}</p>
  </header>

  <main class="app-main">
    <!-- 操作パネル: UIで動かせるパラメータのみ配置する -->
    <section id="controls" class="panel">
      <h2>設定</h2>
      <!-- TODO: 入力コントロール（スライダー・チェックボックス等）を追加する -->
    </section>

    <!-- KPI / サマリー -->
    <section id="kpis" class="panel">
      <h2>サマリー</h2>
      <!-- TODO: 主要指標の表示領域 -->
    </section>

    <!-- 結果表示（表・ランキング等） -->
    <section id="result" class="panel">
      <h2>結果</h2>
      <table id="mainTable">
        <thead><!-- TODO: 列見出し --></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- 依存順に読み込む: data（定数）→ logic（計算）→ ui（描画）→ main（結線） -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
